# CI dla PR-ów do main (LK-1.03): typecheck, lint zmienionych plików, testy jednostkowe, skan sekretów.
# Bez sekretów repo i bez bazy.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (pełna historia — diff względem bazy i gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10 # pnpm-lock.yaml: lockfileVersion 9.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Decyzja tj 2026-11-03: lint tylko plików .ts/.tsx zmienionych w PR (stare błędy to osobny dług).
      - name: Lint (zmienione pliki .ts/.tsx)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- '*.ts' '*.tsx')
          if [ ${#files[@]} -eq 0 ]; then
            echo "Brak zmienionych plików .ts/.tsx — nic do lintowania."
            exit 0
          fi
          printf 'Lintuję %d plik(ów):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          pnpm exec eslint -- "${files[@]}"

      - name: Unit tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: pnpm test:unit

      - name: Secret scan (gitleaks, cała historia)
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: git --redact --no-banner --verbose .
